name: build-ios

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - name: Environment
        run: |
          sw_vers
          xcodebuild -version

      - name: Install XcodeGen
        timeout-minutes: 10
        run: |
          set -e
          if command -v xcodegen >/dev/null 2>&1; then
            echo "XCODEGEN=xcodegen" >> "$GITHUB_ENV"
            xcodegen --version
            exit 0
          fi
          for V in 2.44.1 2.43.0 2.42.0; do
            if curl -fsSL -o /tmp/xcodegen.zip "https://github.com/yonaskolb/XcodeGen/releases/download/$V/xcodegen.zip"; then
              unzip -q -o /tmp/xcodegen.zip -d /tmp/xg
              BIN=$(find /tmp/xg -type f -name xcodegen | head -1)
              chmod +x "$BIN"
              echo "XCODEGEN=$BIN" >> "$GITHUB_ENV"
              "$BIN" --version
              exit 0
            fi
            echo "version $V failed, trying next"
          done
          HOMEBREW_NO_AUTO_UPDATE=1 brew install xcodegen
          echo "XCODEGEN=xcodegen" >> "$GITHUB_ENV"

      - name: Generate app icon
        run: python3 tools/mkicon.py

      - name: Generate Xcode project
        run: $XCODEGEN generate --spec project.yml

      - name: Build
        run: |
          set -o pipefail
          xcodebuild -project PiggyPot.xcodeproj \
            -scheme PiggyPot \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            build 2>&1 | tee build.log

      - name: Package unsigned IPA
        if: success()
        run: |
          set -e
          rm -rf Payload
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/PiggyPot.app Payload/
          rm -f PiggyPot-unsigned.ipa
          zip -qry PiggyPot-unsigned.ipa Payload
          ls -lh PiggyPot-unsigned.ipa

      - name: Publish release
        if: always()
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: build ${{ github.run_number }}
          fail_on_unmatched_files: false
          files: |
            PiggyPot-unsigned.ipa
            build.log
